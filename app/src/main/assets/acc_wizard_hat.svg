<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="wizHat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="wizBelt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="goldBuckle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <filter id="wizShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <g filter="url(#wizShadow)">
    <!-- Main Cone -->
    <path d="M 85,22 Q 95,28 80,35 Q 52,48 42,75 Q 68,82 92,75 Q 85,55 85,22 Z" fill="url(#wizHat)" stroke="#3b0764" stroke-width="2"/>
    <!-- Sparkles on hat -->
    <polygon points="50,45 52,48 55,48 53,50 54,53 50,51 46,53 47,50 45,48 48,48" fill="#fde047"/>
    <polygon points="72,38 73,40 75,40 74,41 74,43 72,42 70,43 71,41 70,40 72,40" fill="#fde047"/>
    <polygon points="62,58 63,60 65,60 64,61 64,63 62,62 60,63 61,61 60,60 62,60" fill="#fde047"/>
    <path d="M 76,48 L 78,52 L 82,52 L 79,54 L 80,58 L 76,55 L 72,58 L 73,54 L 70,52 L 74,52 Z" fill="#ffffff" opacity="0.9"/>
    <!-- Belt Band -->
    <path d="M 38,72 Q 65,81 92,72 L 95,78 Q 65,87 35,78 Z" fill="url(#wizBelt)" stroke="#270e04" stroke-width="1.5"/>
    <!-- Buckle -->
    <rect x="54" y="70" width="16" height="14" rx="3" fill="url(#goldBuckle)" stroke="#713f12" stroke-width="2"/>
    <rect x="58" y="73" width="8" height="8" rx="1" fill="#451a03"/>
    <!-- Wide Brim -->
    <path d="M 12,82 C 35,68 95,68 110,82 C 90,98 30,98 12,82 Z" fill="url(#wizHat)" stroke="#3b0764" stroke-width="2"/>
  </g>
</svg>
