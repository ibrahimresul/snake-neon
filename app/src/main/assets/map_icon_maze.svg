<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <filter id="glowMapMaze" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Octagonal Outer Frame -->
  <polygon points="25,5 95,5 115,25 115,95 95,115 25,115 5,95 5,25" fill="#241903" stroke="#facc15" stroke-width="3" filter="url(#glowMapMaze)" />

  <!-- Inner Arena Golden Maze Matrix Grid -->
  <rect x="16" y="16" width="88" height="88" rx="4" fill="#181307" stroke="#eab308" stroke-width="1.5" />

  <!-- Maze Walls -->
  <g stroke="#eab308" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowMapMaze)">
    <path d="M 28 28 H 92 V 42 M 28 42 V 78 M 92 56 V 92 M 42 92 H 78" fill="none" />
    <path d="M 42 42 H 78 V 78 H 56" fill="none" stroke="#fde047" stroke-width="2" />
  </g>

  <!-- Center Glowing Diamond Node -->
  <polygon points="60,53 67,60 60,67 53,60" fill="#fde047" stroke="#ffffff" stroke-width="1" filter="url(#glowMapMaze)" />
</svg>
