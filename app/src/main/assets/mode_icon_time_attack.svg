<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <filter id="glowTime" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Octagonal Card Background -->
  <polygon points="25,5 95,5 115,25 115,95 95,115 25,115 5,95 5,25" fill="#201103" stroke="#f97316" stroke-width="3" filter="url(#glowTime)" />
  <polygon points="27,8 93,8 112,27 112,93 93,112 27,112 8,93 8,27" fill="none" stroke="#fdba74" stroke-width="1.2" opacity="0.6" />

  <!-- Speed motion lines behind clock -->
  <path d="M 16 42 L 32 42 M 12 58 L 26 58 M 18 74 L 30 74" stroke="#f97316" stroke-width="3" stroke-linecap="round" opacity="0.8" />

  <!-- Outer Stopwatch Circle -->
  <circle cx="65" cy="62" r="30" fill="#2a1405" stroke="#f97316" stroke-width="4.5" filter="url(#glowTime)" />
  <circle cx="65" cy="62" r="24" fill="none" stroke="#fde047" stroke-width="1.5" opacity="0.7" />

  <!-- Top Button & Ring -->
  <rect x="61" y="24" width="8" height="8" fill="#fde047" rx="1" />
  <path d="M 57 24 H 73" stroke="#f97316" stroke-width="3" stroke-linecap="round" />

  <!-- Clock Hands -->
  <line x1="65" y1="62" x2="65" y2="44" stroke="#ffffff" stroke-width="3" stroke-linecap="round" filter="url(#glowTime)" />
  <line x1="65" y1="62" x2="78" y2="62" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" filter="url(#glowTime)" />
  <circle cx="65" cy="62" r="3" fill="#ffffff" />
</svg>
