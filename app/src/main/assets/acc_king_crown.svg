<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="crownGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="crownJewel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="crownGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#ca8a04" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g filter="url(#crownGlow)">
    <!-- Main 5-Peak Crown Structure -->
    <path d="M 18,78 L 10,32 L 35,52 L 60,20 L 85,52 L 110,32 L 102,78 Z" fill="url(#crownGold)" stroke="#713f12" stroke-width="2.5"/>
    <!-- Peak Balls -->
    <circle cx="10" cy="32" r="4.5" fill="#fef08a" stroke="#713f12" stroke-width="1.5"/>
    <circle cx="35" cy="52" r="3.5" fill="#fef08a" stroke="#713f12" stroke-width="1.5"/>
    <circle cx="60" cy="20" r="5.5" fill="#fef08a" stroke="#713f12" stroke-width="1.5"/>
    <circle cx="85" cy="52" r="3.5" fill="#fef08a" stroke="#713f12" stroke-width="1.5"/>
    <circle cx="110" cy="32" r="4.5" fill="#fef08a" stroke="#713f12" stroke-width="1.5"/>
    <!-- Center Diamond Gem -->
    <polygon points="60,48 68,58 60,68 52,58" fill="url(#crownJewel)" stroke="#155e75" stroke-width="1.5"/>
    <polygon points="60,48 64,58 60,68" fill="#a5f3fc" opacity="0.6"/>
    <!-- Side Rubies -->
    <circle cx="34" cy="65" r="3.5" fill="#ef4444" stroke="#7f1d1d" stroke-width="1"/>
    <circle cx="86" cy="65" r="3.5" fill="#ef4444" stroke="#7f1d1d" stroke-width="1"/>
    <!-- Bottom Rim Band -->
    <path d="M 18,76 Q 60,86 102,76 L 100,86 Q 60,96 20,86 Z" fill="url(#crownGold)" stroke="#713f12" stroke-width="2"/>
    <ellipse cx="60" cy="81" rx="38" ry="4" fill="none" stroke="#a16207" stroke-width="1.5"/>
  </g>
</svg>
