<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="gradTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gradSkull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="gradShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <g filter="url(#gradShadow)">
    <!-- Skull Cap Base -->
    <path d="M 38,52 L 38,72 C 38,82 82,82 82,72 L 82,52 Z" fill="url(#gradSkull)" stroke="#020617" stroke-width="2"/>
    <!-- Mortarboard Diamond Top -->
    <polygon points="60,25 110,48 60,65 10,48" fill="url(#gradTop)" stroke="#020617" stroke-width="2.5"/>
    <polygon points="60,28 102,48 60,62 18,48" fill="none" stroke="#475569" stroke-width="1"/>
    <!-- Center Button -->
    <ellipse cx="60" cy="48" rx="4" ry="3" fill="#0f172a" stroke="url(#gradGold)" stroke-width="1.5"/>
    <!-- Gold Tassel Band & Cord hanging to right -->
    <path d="M 60,48 Q 80,45 92,60" fill="none" stroke="url(#gradGold)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Tassel Fringe -->
    <polygon points="90,60 96,60 98,82 88,82" fill="url(#gradGold)" stroke="#854d0e" stroke-width="1"/>
    <line x1="93" y1="60" x2="93" y2="82" stroke="#fef08a" stroke-width="1"/>
  </g>
</svg>
