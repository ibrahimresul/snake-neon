<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="santaRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="80%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="santaRedDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="santaFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="santaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#santaShadow)">
    <!-- Solid Red Main Body of Hat -->
    <path d="M 22,78 C 22,50 40,25 65,20 C 85,16 95,35 98,78 Z" fill="url(#santaRed)" stroke="#7f1d1d" stroke-width="2" stroke-linejoin="round"/>
    <!-- Folded droop extension on top-left -->
    <path d="M 65,20 C 45,20 28,30 22,48 C 20,54 26,58 32,56 C 40,54 52,38 65,20 Z" fill="url(#santaRedDark)" stroke="#7f1d1d" stroke-width="1.5"/>
    <!-- Pom Pom at folded tip -->
    <circle cx="20" cy="52" r="11" fill="url(#santaFur)" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="18" cy="50" r="8" fill="#ffffff" opacity="0.8"/>
    <!-- White Fluffy Fur Rim at Base -->
    <path d="M 18,78 Q 22,70 30,75 Q 38,70 46,75 Q 54,70 62,75 Q 70,70 78,75 Q 86,70 94,75 Q 102,70 104,78 Q 104,88 96,88 Q 60,92 24,88 Q 16,88 18,78 Z" fill="url(#santaFur)" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
</svg>
