<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <filter id="glowMapForest" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Octagonal Outer Frame -->
  <polygon points="25,5 95,5 115,25 115,95 95,115 25,115 5,95 5,25" fill="#031f13" stroke="#10b981" stroke-width="3" filter="url(#glowMapForest)" />

  <!-- Inner Arena Forest Grid -->
  <rect x="16" y="16" width="88" height="88" rx="4" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />

  <!-- Forest Grid Lines -->
  <path d="M 16 38 H 104 M 16 60 H 104 M 16 82 H 104 M 38 16 V 104 M 60 16 V 104 M 82 16 V 104" stroke="#047857" stroke-width="1" />

  <!-- Pine Trees -->
  <polygon points="30,22 23,32 37,32" fill="#059669" stroke="#6ee7b7" stroke-width="1" />
  <polygon points="30,28 21,38 39,38" fill="#047857" stroke="#6ee7b7" stroke-width="1" />

  <polygon points="90,22 83,32 97,32" fill="#059669" stroke="#6ee7b7" stroke-width="1" />
  <polygon points="90,28 81,38 99,38" fill="#047857" stroke="#6ee7b7" stroke-width="1" />

  <polygon points="30,76 23,86 37,86" fill="#059669" stroke="#6ee7b7" stroke-width="1" />
  <polygon points="30,82 21,92 39,92" fill="#047857" stroke="#6ee7b7" stroke-width="1" />

  <polygon points="90,76 83,86 97,86" fill="#059669" stroke="#6ee7b7" stroke-width="1" />
  <polygon points="90,82 81,92 99,92" fill="#047857" stroke="#6ee7b7" stroke-width="1" />

  <!-- Tree Stump -->
  <circle cx="60" cy="60" r="5" fill="#78350f" stroke="#d97706" stroke-width="1" />
</svg>
