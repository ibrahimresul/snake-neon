<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <filter id="glowMapCyber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Octagonal Outer Frame -->
  <polygon points="25,5 95,5 115,25 115,95 95,115 25,115 5,95 5,25" fill="#180528" stroke="#d946ef" stroke-width="3" filter="url(#glowMapCyber)" />

  <!-- Inner Arena Cyber Grid -->
  <rect x="16" y="16" width="88" height="88" rx="4" fill="#111827" stroke="#ec4899" stroke-width="1.5" />

  <!-- Neon Road & Buildings Grid -->
  <rect x="24" y="24" width="28" height="28" fill="#1f2937" stroke="#a855f7" stroke-width="1.5" />
  <rect x="68" y="24" width="28" height="28" fill="#1f2937" stroke="#00f3ff" stroke-width="1.5" />
  <rect x="24" y="68" width="28" height="28" fill="#1f2937" stroke="#00f3ff" stroke-width="1.5" />
  <rect x="68" y="68" width="28" height="28" fill="#1f2937" stroke="#a855f7" stroke-width="1.5" />

  <!-- Cyber Neon Road Lines -->
  <path d="M 60 16 V 104 M 16 60 H 104" stroke="#d946ef" stroke-width="3" filter="url(#glowMapCyber)" />
  <path d="M 60 16 V 104 M 16 60 H 104" stroke="#ffffff" stroke-width="1" stroke-dasharray="4,4" />
</svg>
