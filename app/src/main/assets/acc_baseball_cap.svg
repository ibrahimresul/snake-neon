<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="capDome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="60%" stop-color="#e60000"/>
      <stop offset="100%" stop-color="#990000"/>
    </linearGradient>
    <linearGradient id="capVisor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3333"/>
      <stop offset="100%" stop-color="#800000"/>
    </linearGradient>
    <filter id="capShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <g filter="url(#capShadow)">
    <!-- Main Dome -->
    <path d="M 30,70 C 25,35 50,22 75,28 C 95,33 100,55 98,72 C 75,78 45,78 30,70 Z" fill="url(#capDome)" stroke="#700000" stroke-width="2"/>
    <!-- Panel Seams -->
    <path d="M 65,25 Q 60,48 55,73" fill="none" stroke="#b30000" stroke-width="2" stroke-linecap="round"/>
    <path d="M 65,25 Q 78,45 88,68" fill="none" stroke="#b30000" stroke-width="2" stroke-linecap="round"/>
    <!-- Top Button -->
    <ellipse cx="65" cy="25" rx="5" ry="4" fill="#cc0000" stroke="#600000" stroke-width="1.5"/>
    <!-- Visor / Peak pointing left -->
    <path d="M 32,68 C 12,68 5,78 12,85 C 25,90 55,80 68,74 C 50,71 38,70 32,68 Z" fill="url(#capVisor)" stroke="#600000" stroke-width="2"/>
    <!-- Visor Highlight -->
    <path d="M 16,80 C 25,84 45,78 55,75" fill="none" stroke="#ff9999" stroke-width="2" opacity="0.6"/>
  </g>
</svg>
