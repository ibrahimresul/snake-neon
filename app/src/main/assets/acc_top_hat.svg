<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="hatBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e222a"/>
      <stop offset="35%" stop-color="#3a404d"/>
      <stop offset="70%" stop-color="#181b22"/>
      <stop offset="100%" stop-color="#0d0f13"/>
    </linearGradient>
    <linearGradient id="hatBrim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d333f"/>
      <stop offset="100%" stop-color="#111318"/>
    </linearGradient>
    <linearGradient id="hatBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#525866"/>
      <stop offset="50%" stop-color="#9aa2b3"/>
      <stop offset="100%" stop-color="#3c4250"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Top Oval -->
    <ellipse cx="60" cy="30" rx="30" ry="8" fill="url(#hatBody)"/>
    <!-- Cylinder -->
    <path d="M 30,30 L 32,72 Q 60,80 88,72 L 90,30 Z" fill="url(#hatBody)"/>
    <!-- Highlight shine -->
    <path d="M 40,32 Q 42,50 43,71 Q 48,72 49,71 Q 48,50 45,32 Z" fill="#ffffff" opacity="0.15"/>
    <!-- Ribbon Band -->
    <path d="M 32,62 Q 60,70 88,62 L 88.5,72 Q 60,80 31.5,72 Z" fill="url(#hatBand)"/>
    <!-- Curved Brim -->
    <path d="M 12,78 Q 60,102 108,78 Q 90,68 60,74 Q 30,68 12,78 Z" fill="url(#hatBrim)"/>
    <ellipse cx="60" cy="74" rx="28.5" ry="6" fill="none" stroke="#101216" stroke-width="1.5"/>
  </g>
</svg>
