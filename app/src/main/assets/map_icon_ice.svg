<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <filter id="glowMapIce" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Octagonal Outer Frame -->
  <polygon points="25,5 95,5 115,25 115,95 95,115 25,115 5,95 5,25" fill="#031628" stroke="#00f3ff" stroke-width="3" filter="url(#glowMapIce)" />

  <!-- Inner Arena Ice Grid -->
  <rect x="16" y="16" width="88" height="88" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />

  <!-- Ice Tiles Grid -->
  <path d="M 16 38 H 104 M 16 60 H 104 M 16 82 H 104 M 38 16 V 104 M 60 16 V 104 M 82 16 V 104" stroke="#0369a1" stroke-width="1" />

  <!-- Blue Ice Crystals -->
  <polygon points="28,24 34,32 28,40 22,32" fill="#e0f2fe" stroke="#00f3ff" stroke-width="1.5" filter="url(#glowMapIce)" />
  <polygon points="92,24 98,32 92,40 86,32" fill="#e0f2fe" stroke="#00f3ff" stroke-width="1.5" filter="url(#glowMapIce)" />
  <polygon points="28,80 34,88 28,96 22,88" fill="#e0f2fe" stroke="#00f3ff" stroke-width="1.5" filter="url(#glowMapIce)" />
  <polygon points="92,80 98,88 92,96 86,88" fill="#e0f2fe" stroke="#00f3ff" stroke-width="1.5" filter="url(#glowMapIce)" />

  <!-- Center Crystal -->
  <polygon points="60,50 67,60 60,70 53,60" fill="#7dd3fc" stroke="#ffffff" stroke-width="1.5" />
</svg>
