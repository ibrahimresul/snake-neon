<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="alienGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <radialGradient id="alienGlow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="40%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </radialGradient>
    <filter id="alienGlowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g>
    <!-- Headband Arch -->
    <path d="M 22,82 C 22,50 98,50 98,82 C 92,82 88,58 60,58 C 32,58 28,82 22,82 Z" fill="url(#alienGreen)" stroke="#14532d" stroke-width="2"/>
    <!-- Left Stalk -->
    <path d="M 38,62 Q 28,40 25,28" fill="none" stroke="url(#alienGreen)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 38,62 Q 28,40 25,28" fill="none" stroke="#14532d" stroke-width="1.5"/>
    <!-- Right Stalk -->
    <path d="M 82,62 Q 92,40 95,28" fill="none" stroke="url(#alienGreen)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 82,62 Q 92,40 95,28" fill="none" stroke="#14532d" stroke-width="1.5"/>
    <!-- Left Sphere -->
    <circle cx="23" cy="24" r="12" fill="url(#alienGlow)" stroke="#14532d" stroke-width="2" filter="url(#alienGlowFilter)"/>
    <circle cx="20" cy="20" r="3.5" fill="#ffffff" opacity="0.8"/>
    <!-- Right Sphere -->
    <circle cx="97" cy="24" r="12" fill="url(#alienGlow)" stroke="#14532d" stroke-width="2" filter="url(#alienGlowFilter)"/>
    <circle cx="94" cy="20" r="3.5" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>
