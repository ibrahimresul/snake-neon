<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <filter id="glowMapDesert" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Octagonal Outer Frame -->
  <polygon points="25,5 95,5 115,25 115,95 95,115 25,115 5,95 5,25" fill="#291503" stroke="#eab308" stroke-width="3" filter="url(#glowMapDesert)" />

  <!-- Inner Arena Desert Grid -->
  <rect x="16" y="16" width="88" height="88" rx="4" fill="#d97706" stroke="#fde047" stroke-width="1.5" />

  <!-- Desert Grid Lines -->
  <path d="M 16 38 H 104 M 16 60 H 104 M 16 82 H 104 M 38 16 V 104 M 60 16 V 104 M 82 16 V 104" stroke="#b45309" stroke-width="1" />

  <!-- Cacti -->
  <!-- Cactus 1 -->
  <path d="M 30 36 V 24 M 27 28 H 33 V 32" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" />
  <!-- Cactus 2 -->
  <path d="M 90 78 V 66 M 87 70 H 93 V 74" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" />

  <!-- Desert Rocks -->
  <rect x="36" y="72" width="10" height="8" rx="2" fill="#78350f" stroke="#d97706" stroke-width="1" />
  <rect x="74" y="32" width="12" height="9" rx="2" fill="#78350f" stroke="#d97706" stroke-width="1" />
</svg>
