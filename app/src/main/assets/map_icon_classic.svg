<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <filter id="glowMapClassic" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Octagonal Outer Frame -->
  <polygon points="25,5 95,5 115,25 115,95 95,115 25,115 5,95 5,25" fill="#051c0d" stroke="#22c55e" stroke-width="3" filter="url(#glowMapClassic)" />

  <!-- Inner Arena Grid View -->
  <rect x="16" y="16" width="88" height="88" rx="4" fill="#15803d" stroke="#4ade80" stroke-width="1.5" />

  <!-- Grid Pattern Tiles -->
  <path d="M 16 38 H 104 M 16 60 H 104 M 16 82 H 104 M 38 16 V 104 M 60 16 V 104 M 82 16 V 104" stroke="#166534" stroke-width="1" />

  <!-- Bushes & Trees -->
  <circle cx="28" cy="28" r="7" fill="#22c55e" stroke="#86efac" stroke-width="1" />
  <circle cx="92" cy="28" r="7" fill="#22c55e" stroke="#86efac" stroke-width="1" />
  <circle cx="28" cy="92" r="7" fill="#22c55e" stroke="#86efac" stroke-width="1" />
  <circle cx="92" cy="92" r="7" fill="#22c55e" stroke="#86efac" stroke-width="1" />
  
  <!-- Rocks & Stumps -->
  <rect x="48" y="70" width="8" height="6" rx="2" fill="#64748b" />
  <rect x="70" y="44" width="7" height="7" rx="2" fill="#64748b" />
</svg>
