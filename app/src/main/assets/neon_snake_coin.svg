<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="neonCoinGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="coinBgGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="65%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>
    <linearGradient id="neonGoldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffaa" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>

  <!-- Outer Ambient Glow -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#fde047" stroke-width="4" opacity="0.45" filter="url(#neonCoinGlow)" />

  <!-- Outer Solid Edge / 3D Bevel -->
  <circle cx="51.5" cy="52" r="42" fill="#451a03" opacity="0.6"/>
  <circle cx="50" cy="50" r="42" fill="url(#coinBgGrad)" stroke="#b45309" stroke-width="2"/>

  <!-- Outer Neon Gold Ring -->
  <circle cx="50" cy="50" r="39.5" fill="none" stroke="url(#neonGoldBorder)" stroke-width="3" filter="url(#neonCoinGlow)" />
  <circle cx="50" cy="50" r="35" fill="none" stroke="#92400e" stroke-width="1.5" opacity="0.8" />

  <!-- Inner Neon Ring -->
  <circle cx="50" cy="50" r="31" fill="none" stroke="#fef08a" stroke-width="2.2" filter="url(#neonCoinGlow)" />

  <!-- Snake S Emblem -->
  <g filter="url(#neonCoinGlow)">
    <!-- Main Snake Body -->
    <path d="M 37 59 C 36 65, 45 68, 51 68 C 58 68, 60 60, 56 54 C 47 45, 41 47, 42 38 C 43 30, 52 28, 58 33 C 61 35.5, 63 36, 64.5 36" 
          fill="none" stroke="#fff9a6" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 37 59 C 36 65, 45 68, 51 68 C 58 68, 60 60, 56 54 C 47 45, 41 47, 42 38 C 43 30, 52 28, 58 33 C 61 35.5, 63 36, 64.5 36" 
          fill="none" stroke="#facc15" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Snake Head -->
    <path d="M 63 36 C 65.5 35, 67.5 37, 66.5 39 C 65.5 41, 63 40, 62 38 Z" fill="#fff9a6" />
    <circle cx="65" cy="37" r="0.9" fill="#78350f" />
    
    <!-- Snake Tongue -->
    <path d="M 66.8 38.5 L 70 37.5 M 66.8 38.5 L 70 39.5" stroke="#fde047" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Lens Flare Sparkles -->
  <g filter="url(#neonCoinGlow)" opacity="0.95">
    <path d="M 77 24 L 78.5 28 L 82.5 29.5 L 78.5 31 L 77 35 L 75.5 31 L 71.5 29.5 L 75.5 28 Z" fill="#ffffff" />
    <circle cx="77" cy="29.5" r="1.5" fill="#fff" />

    <path d="M 23 68 L 24 71 L 27 72 L 24 73 L 23 76 L 22 73 L 19 72 L 22 71 Z" fill="#ffffff" opacity="0.8" />
  </g>
</svg>
