<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <filter id="glowClassic" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Dark Octagonal Card Background -->
  <polygon points="25,5 95,5 115,25 115,95 95,115 25,115 5,95 5,25" fill="#06180c" stroke="#22c55e" stroke-width="3" filter="url(#glowClassic)" />
  <polygon points="27,8 93,8 112,27 112,93 93,112 27,112 8,93 8,27" fill="none" stroke="#4ade80" stroke-width="1.2" opacity="0.6" />

  <!-- Pixel Grid Overlay -->
  <path d="M 20 20 H 100 V 100 H 20 Z" fill="none" stroke="#15803d" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.4" />

  <!-- Pixel Green Snake -->
  <!-- Snake Body Blocks -->
  <rect x="24" y="66" width="12" height="12" rx="2" fill="#22c55e" stroke="#86efac" stroke-width="1.5" />
  <rect x="36" y="66" width="12" height="12" rx="2" fill="#22c55e" stroke="#86efac" stroke-width="1.5" />
  <rect x="36" y="54" width="12" height="12" rx="2" fill="#22c55e" stroke="#86efac" stroke-width="1.5" />
  <rect x="36" y="42" width="12" height="12" rx="2" fill="#22c55e" stroke="#86efac" stroke-width="1.5" />
  <rect x="48" y="42" width="12" height="12" rx="2" fill="#22c55e" stroke="#86efac" stroke-width="1.5" />
  <rect x="60" y="42" width="12" height="12" rx="2" fill="#22c55e" stroke="#86efac" stroke-width="1.5" />
  
  <!-- Snake Head -->
  <rect x="60" y="30" width="16" height="14" rx="3" fill="#4ade80" stroke="#bbf7d0" stroke-width="2" filter="url(#glowClassic)" />
  <!-- Eye -->
  <rect x="68" y="33" width="4" height="4" fill="#052e16" />
  <!-- Mouth -->
  <path d="M 72 40 H 76" stroke="#052e16" stroke-width="1.5" />

  <!-- Red Pixel Apple -->
  <rect x="88" y="58" width="12" height="12" rx="2" fill="#ef4444" stroke="#fca5a5" stroke-width="1.5" filter="url(#glowClassic)" />
  <rect x="92" y="54" width="3" height="4" fill="#86efac" />
</svg>
