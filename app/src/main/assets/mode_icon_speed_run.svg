<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <filter id="glowSpeed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Octagonal Card Background -->
  <polygon points="25,5 95,5 115,25 115,95 95,115 25,115 5,95 5,25" fill="#041624" stroke="#00f3ff" stroke-width="3" filter="url(#glowSpeed)" />
  <polygon points="27,8 93,8 112,27 112,93 93,112 27,112 8,93 8,27" fill="none" stroke="#7dd3fc" stroke-width="1.2" opacity="0.6" />

  <!-- Speed Motion Trails -->
  <path d="M 18 42 H 45 M 12 58 H 38 M 22 74 H 50" stroke="#00f3ff" stroke-width="3" stroke-linecap="round" opacity="0.8" />

  <!-- Speed Snake Body -->
  <g filter="url(#glowSpeed)">
    <rect x="36" y="52" width="11" height="11" rx="2" fill="#0284c7" />
    <rect x="48" y="52" width="11" height="11" rx="2" fill="#0369a1" />
    <rect x="60" y="52" width="11" height="11" rx="2" fill="#0284c7" />
    <rect x="72" y="52" width="11" height="11" rx="2" fill="#38bdf8" />
    
    <!-- Fast Snake Head -->
    <path d="M 84 49 L 102 57.5 L 84 66 Z" fill="#00f3ff" />
    <circle cx="90" cy="55" r="1.5" fill="#032b45" />
  </g>
</svg>
